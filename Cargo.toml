[workspace]
resolver = "2"
members = [
    "crates/fge-core",
    "crates/fge-abi",
    "crates/fge-loader",
    "crates/fge-render",
    "crates/fge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
fge-core = { path = "crates/fge-core" }
fge-abi = { path = "crates/fge-abi" }
fge-loader = { path = "crates/fge-loader" }
fge-render = { path = "crates/fge-render" }
wgpu = "30.0.1"
winit = "0.30.13"
glam = "0.33.6"
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "1.0.1"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
thiserror = "2.0.21"
log = "0.4.35"
env_logger = "0.11.12"
fastrand = "2.5.0"
libloading = "0.8.9"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"
debug = false
strip = "none"
